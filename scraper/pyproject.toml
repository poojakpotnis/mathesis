[project]
name = "mathesis-scraper"
version = "0.1.0"
description = "Local lesson importer for a math homework portal"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "httpx>=0.28",
    "pydantic>=2.10",
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "arize-phoenix>=10.0",
    "pandas>=2.2",
    "anthropic>=0.106.0",
]

[project.scripts]
scrape = "scrape:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["src", "evals"]
